name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::218733195326:role/github-actions-role
          aws-region: ap-southeast-2
      - run: aws sts get-caller-identity
      - run: |
          echo "<h1>Deployed by GitHub Actions</h1>" > index.html
          aws s3 cp index.html s3://skdevops-lab-12345/deploy/index.html
